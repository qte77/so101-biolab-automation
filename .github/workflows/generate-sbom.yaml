name: Generate SBOM

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/SBOM/**"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate SBOM
        uses: qte77/gha-sbom-action@f1aca6c93b91fa3f41060db5c9251fc2715e3c77 # v0.1.0
        with:
          create_pr: "false"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit SBOM to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SBOM
          if git diff --cached --quiet; then
            echo "SBOM unchanged — nothing to commit"
          else
            git commit -m "docs: update SBOM [skip ci]"
            git push || echo "::warning::SBOM push rejected by branch protection. Allow the github-actions[bot] to bypass push restrictions on main to enable auto-commit."
          fi
