name: Generate SBOM

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/SBOM/**"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        uses: qte77/gha-sbom-action@c14e7fea31fffaf46c8a995ede2a50caf560ed2b # v0.1.0
        with:
          create_pr: "false"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit SBOM to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SBOM
          if git diff --cached --quiet; then
            echo "SBOM unchanged — nothing to commit"
          else
            git commit -m "docs: update SBOM [skip ci]"
            git push || echo "::warning::SBOM push rejected by branch protection. Allow the github-actions[bot] to bypass push restrictions on main to enable auto-commit."
          fi
