[project]
name = "so101-biolab-automation"
version = "0.2.0"
description = "Dual SO-101 robotic arm bio-lab automation: pipetting, tool changing, remote oversight"
readme = "README.md"
license = "Apache-2.0"
# Pin 3.12: build123d → cadquery-ocp → VTK has no cp313 wheels
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.1",  # >=0.136.1 tracks starlette 1.x (security baseline)
    "uvicorn[standard]>=0.49.0",
    "websockets>=13.0",
    "opencv-python>=4.10",
    "pyserial>=3.5",
    "pydantic>=2.13.4",
    "pydantic-settings[yaml]>=2.14.2",
    "pyyaml>=6.0",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "pyright>=1.1.410",
    "complexipy>=5.6.1",
    "types-PyYAML>=6.0",
    "opencv-stubs>=0.1.3",
]
test = [
    "scriv[toml]>=1.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.155.6",
    "inline-snapshot>=0.34.1",
    "httpx>=0.27",
]
lerobot = [  # SO-101 teleoperation, recording, training (pulls torch)
    "lerobot[feetech]",
]
train = [  # ACT policy training — requires GPU; wandb opt-in via WANDB=1
    "lerobot[feetech]",
    "wandb>=0.27.2",
]
foxglove = [  # Live visualization + MCAP recording
    "foxglove-sdk>=0.25.2",
    "scipy>=1.18.0",
    "yourdfpy",
]
cad = [
    "build123d>=0.11.0",
]
eln = [
    "elabapi-python>=5.5.11",
]
pylabrobot = [
    "pylabrobot>=0.2",
]
pipette = [  # Electronic pipette driver (AELAB dPette 7016, DLAB dPette+)
    "dpette",
]

[tool.uv.sources]
dpette = { git = "https://github.com/Lambda-Biolab/dpette-usb-driver.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/so101", "src/dashboard"]

[project.scripts]
so101-patch-lerobot = "so101.cli.patch_lerobot:main"
so101-scan-servos = "so101.cli.scan_servos:main"
so101-demo = "so101.cli.run_demo:main"
so101-coord = "so101.cli.coordinate_cmd:main"
so101-foxglove = "so101.cli.foxglove_viz:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "test"]
link-mode = "copy"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "SIM", "RUF", "PT", "ANN", "TCH", "PGH", "C90", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "ANN001", "ANN201", "D100", "D101", "D102", "D103", "D104", "D107"]
"src/hardware/cad/**" = ["S603", "ANN"]   # CAD scripts excluded from pyright; annotations deferred
"src/hardware/**" = ["S603"]    # subprocess calls run trusted internal scripts
"src/so101/cli/foxglove_viz.py" = ["ANN401"]  # hardware CLI — untyped deps return Any
"src/so101/cli/patch_lerobot.py" = ["E501"]  # triple-quoted strings mirror lerobot source verbatim

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["src"]
include = ["src/so101", "src/dashboard"]
exclude = [
    "src/hardware",           # CAD/render/slicer use dynamic imports without type stubs
    "src/so101/cli/foxglove_viz.py",  # hardware CLI — foxglove/lerobot/scipy/yourdfpy all untyped
    "src/so101/cli/scan_servos.py",   # hardware CLI — scservo_sdk is untyped
]
reportMissingImports = "error"
reportMissingTypeStubs = "none"  # lerobot, pyserial — installed but untyped

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not hardware and not network and not lerobot'"
asyncio_mode = "auto"
markers = [
    "integration: tests loading real config files",
    "network: tests requiring network access",
    "hardware: tests requiring physical SO-101 arms or cameras",
    "lerobot: tests requiring lerobot package installed (uv sync --group lerobot)",
]

[tool.bumpversion]
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
allow_dirty = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "version-{current_version}--alpha-58f4c2"
replace = "version-{new_version}-58f4c2"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = """
## [Unreleased]
"""
replace = """
## [Unreleased]

## [{new_version}] - {now:%Y-%m-%d}
"""

[tool.coverage.run]
omit = ["src/so101/cli/foxglove_viz.py"]  # hardware CLI — requires real arms + cameras

[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_html_anchors = false
